<!doctype html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Match des Légendes — Équipe de France</title>
<style>
  :root { --bleu:#0055a4; --rouge:#ef4135; --or:#c9a227; --fond:#f4f6fa; }
  * { box-sizing:border-box; margin:0; }
  body { font-family:system-ui,-apple-system,'Segoe UI',sans-serif; background:var(--fond); color:#1c2430; }
  header { background:linear-gradient(135deg,#0055a4 45%,#fff 45%,#fff 55%,#ef4135 55%); padding:14px; text-align:center; }
  header h1 { color:#fff; text-shadow:0 2px 6px rgba(0,0,0,.45); font-size:1.7rem; letter-spacing:.5px; }
  header p { font-size:.9rem; color:#fff; text-shadow:0 1px 4px rgba(0,0,0,.45); }
  nav { display:flex; justify-content:center; gap:10px; padding:12px; flex-wrap:wrap; }
  nav button { border:none; padding:10px 22px; border-radius:999px; background:#fff; color:var(--bleu); font-weight:700; cursor:pointer; box-shadow:0 1px 4px rgba(0,0,0,.12); font-size:1rem; }
  nav button.actif { background:var(--bleu); color:#fff; }
  main { max-width:1000px; margin:0 auto; padding:16px; }
  .grille { display:grid; grid-template-columns:repeat(auto-fill,minmax(180px,1fr)); gap:14px; }
  .carte { background:#fff; border-radius:12px; overflow:hidden; box-shadow:0 2px 8px rgba(0,0,0,.12); border-top:5px solid var(--bleu); }
  .carte.rouge { border-top-color:var(--rouge); }
  .carte.or { border-top-color:var(--or); }
  .carte .bandeau { padding:8px; background:var(--bleu); color:#fff; font-weight:800; text-align:center; font-size:.85rem; }
  .carte.rouge .bandeau { background:var(--rouge); color:#fff; }
  .carte.or .bandeau { background:linear-gradient(90deg,#f7d774,#c9a227); color:#fff; }
  .carte.staff { border-top-color:#6a4c93; }
  .carte.staff .bandeau { background:#6a4c93; color:#fff; }
  .avatar { display:flex; align-items:center; justify-content:center; height:110px; background:#e8eef6; font-size:3rem; }
  .carte h3 { text-align:center; font-size:1rem; padding:6px 8px 2px; }
  .carte .rare { text-align:center; font-size:.75rem; font-weight:700; color:#6b7687; }
  .stats { display:flex; gap:6px; padding:8px; }
  .stats div { flex:1; text-align:center; border-radius:8px; padding:6px 0; font-weight:800; color:#fff; font-size:.9rem; }
  .atq { background:var(--rouge); } .def { background:#2a9d55; }
  .cap { margin:0 8px 8px; background:#f1f5fb; border-radius:8px; padding:8px; font-size:.8rem; }
  .cap b { color:var(--bleu); display:block; margin-bottom:2px; }
  .zone-duel { background:#fff; border-radius:14px; padding:20px; box-shadow:0 2px 10px rgba(0,0,0,.1); text-align:center; }
  .score { display:flex; justify-content:center; gap:40px; font-size:2.4rem; font-weight:900; margin:10px 0; }
  .score .toi { color:var(--bleu); } .score .ia { color:var(--rouge); }
  .score span { display:block; font-size:.8rem; font-weight:600; color:#6b7687; }
  .main-joueur { display:grid; grid-template-columns:repeat(auto-fill,minmax(130px,1fr)); gap:10px; margin:18px 0; }
  .mini-carte { background:#fff; border:2px solid var(--bleu); border-radius:10px; padding:8px; cursor:pointer; font-size:.85rem; transition:transform .12s; position:relative; }
  .mini-carte:hover { transform:translateY(-3px); }
  .mini-carte.select { background:var(--bleu); color:#fff; }
  .mini-carte.select .mc-stats { color:#dbe6ff; }
  .mini-carte.repo { opacity:.4; cursor:not-allowed; }
  .mini-carte b { display:block; font-size:.9rem; }
  .mc-stats { color:#6b7687; }
  .badge-repo { position:absolute; top:4px; right:6px; font-size:.65rem; font-weight:800; color:#b34700; }
  .actions-row { display:flex; gap:8px; justify-content:center; flex-wrap:wrap; margin:10px 0 4px; }
  .action-btn { background:#fff; border:2px solid var(--rouge); color:var(--rouge); border-radius:8px; padding:6px 12px; font-weight:700; font-size:.85rem; cursor:pointer; }
  .action-btn.select { background:var(--rouge); color:#fff; }
  .action-btn:disabled { opacity:.35; cursor:not-allowed; }
  button.principal { background:var(--rouge); color:#fff; border:none; padding:12px 32px; border-radius:999px; font-size:1.05rem; font-weight:800; cursor:pointer; box-shadow:0 3px 8px rgba(0,0,0,.2); }
  button.principal:disabled { background:#b7bec9; cursor:not-allowed; }
  .log { list-style:none; text-align:left; margin:14px auto 0; max-width:560px; font-size:.9rem; }
  .log li { padding:6px 10px; border-left:4px solid var(--bleu); background:#f1f5fb; margin-bottom:6px; border-radius:0 8px 8px 0; }
  .log li.rouge { border-color:var(--rouge); }
  .verdict { font-size:1.3rem; font-weight:900; margin:10px 0; }
  .phase { font-weight:800; color:var(--bleu); font-size:1.05rem; margin-top:6px; }
  footer { text-align:center; font-size:.75rem; color:#8a93a3; padding:24px; }
  .regles { background:#fff; border-radius:12px; padding:14px 18px; margin:8px auto 0; font-size:.85rem; text-align:left; box-shadow:0 2px 8px rgba(0,0,0,.08); max-width:620px; }
  @media (max-width:520px){ header h1{font-size:1.25rem;} .score{gap:20px;} }
</style>
</head>
<body>

<nav>
  <button id="btn-collection" class="actif">🃏 Collection</button>

<main id="app"></main>
<footer>POC passion, projet club de handball. Contenu illustratif, non affilié à la FFHandball.</footer>

<script>
"use strict";
const CARTES = [
  { t: "Joueur", p: "GARDIEN", n: "Vincent Gérard", rare: "Légende", a: 1, d: 4, cap: "", desc: "", ic: "🧤" },
  { t: "Joueur", p: "GARDIEN", n: "Wesley Pardin", rare: "Rare", a: 1, d: 3, cap: "", desc: "", ic: "🧤" },
  { t: "Joueur", p: "PIVOT", n: "Luka Karabatic", rare: "Rare", a: 2, d: 3, cap: "", desc: "", ic: "🛡️" },
  { t: "Joueur", p: "PIVOT", n: "Cédric Sorhaindo", rare: "Légende", a: 3, d: 2, cap: "", desc: "", ic: "🛡️" },
  { t: "Joueur", p: "AILIER", n: "Hugo Descat", rare: "Rare", a: 4, d: 1, cap: "", desc: "", ic: "🏃" },
  { t: "Joueur", p: "AILIER", n: "Michaël Guigou", rare: "Légende", a: 3, d: 1, cap: "", desc: "", ic: "🏃" },
  { t: "Joueur", p: "ARRIÈRE", n: "Nedim Remili", rare: "Commune", a: 4, d: 2, cap: "", desc: "", ic: "🎯" },
  { t: "Joueur", p: "ARRIÈRE", n: "Nikola Karabatic", rare: "Légende", a: 4, d: 2, cap: "", desc: "", ic: "👑" },
  { t: "Joueur", p: "DEMI", n: "Dika Mem", rare: "Rare", a: 3, d: 3, cap: "", desc: "", ic: "🧠" },
  { t: "Joueur", p: "DEMI", n: "Kylian Bilbault", rare: "Commune", a: 2, d: 2, cap: "", desc: "", ic: "🔁" },
    { t: "Action", p: "ATTAQUE", n: "Attaque placée", rare: "Commune", a: 0, d: 0, cap: "", desc: "+1 sur ton dé d'attaque, impossible à annuler ou réduire.", ic: "📋" },
  { t: "Action", p: "ATTAQUE · TACTIQUE", n: "L'Espagnole", rare: "Commune", a: 0, d: 0, cap: "", desc: "Si le défenseur adverse occupe le poste défensif 1 (ailier) : +2 sur ton dé d'attaque.", ic: "🔀" },
  { t: "Action", p: "ATTAQUE · TACTIQUE", n: "Le Yago", rare: "Commune", a: 0, d: 0, cap: "", desc: "Si le défenseur adverse occupe le poste défensif 3 (pivot ou demi-centre) : +2 sur ton dé d'attaque.", ic: "🔀" },
  { t: "Action", p: "SPECTACULAIRE", n: "Kung-fu", rare: "Peu commune", a: 0, d: 0, cap: "", desc: "Pile ou face avant le tir : face = attaque ratée, pile = +3 sur ton dé.", ic: "🤸" },
  { t: "Action", p: "SPECTACULAIRE", n: "Roucoulette", rare: "Peu commune", a: 0, d: 0, cap: "", desc: "Pile ou face avant le tir : face = attaque ratée, pile = +3 sur ton dé.", ic: "🎡" },
  { t: "Action", p: "SPECTACULAIRE", n: "Lob", rare: "Peu commune", a: 0, d: 0, cap: "", desc: "Pile ou face avant le tir : face = attaque ratée, pile = +3 sur ton dé.", ic: "🌙" },
  { t: "Action", p: "RACHAT", n: "Tir de 7 m", rare: "Rare", a: 0, d: 0, cap: "", desc: "Si ton tir est arrêté : relance un dé, le but est validé s'il dépasse la DEF du gardien adverse.", ic: "🎯" },
  { t: "Action", p: "RACHAT", n: "Coup franc", rare: "Rare", a: 0, d: 0, cap: "", desc: "Si ton tir est arrêté : on relance tous les dés.", ic: "🔙" },
  { t: "Action", p: "RACHAT", n: "2 minutes", rare: "Rare", a: 0, d: 0, cap: "", desc: "Si ton tir est arrêté et que tes joueurs de champ sont tous déjà joués : rejoue la séquence avec un joueur déjà utilisé, sans le consommer.", ic: "⏱️" },
  { t: "Action", p: "RACHAT", n: "Carton jaune", rare: "Rare", a: 0, d: 0, cap: "", desc: "Si ton tir est arrêté : on relance uniquement ton dé d'attaque.", ic: "🟨" },
  { t: "Action", p: "DÉFENSE", n: "Retour placé", rare: "Commune", a: 0, d: 0, cap: "", desc: "+1 sur ton dé de défense, impossible à annuler ou réduire.", ic: "📋" },
  { t: "Action", p: "DÉFENSE · TACTIQUE", n: "Le 5-1", rare: "Commune", a: 0, d: 0, cap: "", desc: "Si le tireur adverse est en P3 (demi) : +2 sur ton dé de défense.", ic: "🔀" },
  { t: "Action", p: "DÉFENSE · TACTIQUE", n: "Le 4-2", rare: "Commune", a: 0, d: 0, cap: "", desc: "Si le tireur adverse est en P2 (arrière) : +2 sur ton dé de défense.", ic: "🧱" },
  { t: "Action", p: "DÉFENSE · TACTIQUE", n: "Le 0-6", rare: "Commune", a: 0, d: 0, cap: "", desc: "Si le tireur adverse est en P1 (ailier) : +2 sur ton dé de défense.", ic: "🧱" },
  { t: "Action", p: "SPECTACULAIRE", n: "Contre-attaque", rare: "Peu commune", a: 0, d: 0, cap: "", desc: "Si le tir adverse est arrêté : pile ou face, face = but immédiat pour toi.", ic: "💨" },
  { t: "Action", p: "RACHAT", n: "Temps mort", rare: "Rare", a: 0, d: 0, cap: "", desc: "Si but encaissé : on relance uniquement ton dé de défense.", ic: "ℹ️" },
  { t: "Action", p: "RACHAT", n: "Remise en jeu", rare: "Rare", a: 0, d: 0, cap: "", desc: "Si but encaissé : on relance tous les dés.", ic: "🔙" },
  { t: "Action", p: "RACHAT", n: "2 minutes (défense)", rare: "Rare", a: 0, d: 0, cap: "", desc: "Si but encaissé et que tes joueurs de champ sont tous déjà joués : rejoue la séquence avec un défenseur déjà utilisé, sans le consommer.", ic: "⏱️" },
  { t: "Action", p: "RACHAT", n: "Réflexe du gardien", rare: "Rare", a: 0, d: 0, cap: "", desc: "Si but encaissé : ton gardien relance seul son dé plafonné ; s'il dépasse l'attaque adverse, le but est annulé.", ic: "🧤" },
  { t: "Staff", p: "STAFF", n: "Vestiaire adverse", rare: "Staff", a: 0, d: 0, cap: "", desc: "Révèle la main Action de l'adversaire jusqu'à la fin de la possession en cours.", ic: "👔" },
  { t: "Staff", p: "STAFF", n: "Recherche tactique", rare: "Staff", a: 0, d: 0, cap: "", desc: "Défausse 1 carte, fouille le deck, choisis une carte tactique (+2), montre-la, ajoute-la à ta main, remélange le deck.", ic: "👔" },
  { t: "Staff", p: "STAFF", n: "Pression sur le banc", rare: "Staff", a: 0, d: 0, cap: "", desc: "Révèle 2 cartes de la main adverse, tu en défausses 1 au choix, l'adversaire pioche 1 carte.", ic: "👔" },
  { t: "Staff", p: "STAFF", n: "Changer de jeu", rare: "Staff", a: 0, d: 0, cap: "", desc: "Défausse 1 carte de ta main, pioche 1 carte.", ic: "👔" },
  { t: "Staff", p: "STAFF", n: "Briefing renforcé", rare: "Staff", a: 0, d: 0, cap: "", desc: "Regarde les 3 premières cartes du deck, défausse-en 1, remets les 2 autres sur le dessus dans l'ordre choisi.", ic: "👔" },
  { t: "Trophée", p: "🥇", n: "Médaille d'Or", rare: "Trophée", a: 0, d: 0, cap: "Tokyo 2020", desc: "Se gagne au tournoi du club. Non échangeable.", ic: "🏅" },
  { t: "Trophée", p: "🏆", n: "Coupe du Monde", rare: "Trophée", a: 0, d: 0, cap: "Collections Experts", desc: "Carte de collection exclusive du club.", ic: "🏆" }
];

const SECTEUR = function (p) { return p === "AILIER" ? 1 : (p === "ARRIÈRE" ? 2 : 3); };
function nouveauDeckAction() {
  const ex = { "Commune": 3, "Peu commune": 2, "Rare": 1 };
  const deck = [];
  for (const c of CARTES) {
    if (c.t !== "Action") continue;
    for (let i = 0; i < ex[c.rare]; i++) deck.push(c.n);
  }
  return melanger(deck);
}
const TACTIQUES = [];
for (const c of CARTES) { if (c.t === "Action" && c.p.indexOf("TACTIQUE") > -1) TACTIQUES.push(c.n); }
const STAFF = CARTES.filter(function (c) { return c.t === "Staff"; }).map(function (c) { return c.n; });
const app = document.getElementById("app");
const btnC = document.getElementById("btn-collection");
const btnD = document.getElementById("btn-duel");

function voirCollection() {
  btnC.classList.add("actif");
  btnD.classList.remove("actif");
  const intro = '<p style="text-align:center;color:#6b7687;margin-bottom:14px">36 cartes au total : 10 joueurs, 19 actions, 5 staff et 2 trophées.</p>';
  let grille = "";
  for (const c of CARTES) {
    const cls = c.t === "Trophée" ? "or" : (c.t === "Staff" ? "staff" : (c.t === "Action" ? "rouge" : ""));
    const isJoueur = c.t === "Joueur";
    let carte = '<div class="carte ' + cls + '">' +
      '<div class="bandeau">' + c.p + "</div>" +
      '<div class="avatar">' + c.ic + "</div>" +
      "<h3>" + c.n + "</h3>" +
      '<div class="rare">' + c.rare + "</div>";
    if (isJoueur) {
      carte += '<div class="stats"><div class="atq">ATQ ' + c.a + '</div><div class="def">DEF ' + c.d + "</div></div>";
      carte += c.desc ? '<div class="cap">' + c.desc + "</div>" : "";
    } else {
      carte += '<div class="cap">' + c.desc + "</div>";
    }
    carte += "</div>";
    grille += carte;
  }
  app.innerHTML = intro + '<div class="grille">' + grille + "</div>";
}

const d6 = () => 1 + Math.floor(Math.random() * 6);
function melanger(tab) { return tab.slice().sort(function () { return Math.random() - 0.5; }); }
function composerEquipe(joueurs) {
  const parPoste = function (poste) { return joueurs.filter(function (c) { return c.p === poste; }); };
  // Composition classique : 1 gardien + 2 ailiers + 2 arrières + 1 pivot + 1 demi-centre
  return melanger(parPoste("GARDIEN")).slice(0, 1) // gardien unique (hasard entre V. Gérard et Pardin)
    .concat(melanger(parPoste("AILIER")).slice(0, 2)) // 2 ailiers
    .concat(melanger(parPoste("ARRIÈRE")).slice(0, 2)) // 2 arrières
    .concat(melanger(parPoste("PIVOT")).slice(0, 1)) // 1 pivot (hasard entre Luka et Sorhaindo)
    .concat(melanger(parPoste("DEMI")).slice(0, 1)); // 1 demi-centre
}
function gardienDe(equipe) {
  for (const c of equipe) { if (c.p === "GARDIEN") return c; }
  return null;
}

let m = null;
function recharger(cote) {
  m[cote === "toi" ? "deckToi" : "deckIA"] = nouveauDeckAction();
  m[cote === "toi" ? "staffToi" : "staffIA"].forEach(function (s) { s.used = false; });
  if (cote === "toi") m.mullToi = false; else m.mullIA = false;
}
function piocher(cote) {
  const deck = cote === "toi" ? m.deckToi : m.deckIA;
  const main = cote === "toi" ? m.mainToi : m.mainIA;
  while (main.length < 3 && deck.length > 0) main.push(deck.shift());
}
function nouveauMatch() {
  const joueurs = CARTES.filter(function (c) { return c.t === "Joueur"; });
  m = {
    toi: composerEquipe(joueurs),
    ia: composerEquipe(joueurs),
    repoToi: [], repoIA: [],
    scoreToi: 0, scoreIA: 0,
    tour: 0, totalTours: 12,
    deckToi: [], deckIA: [], mainToi: [], mainIA: [],
    staffToi: STAFF.map(function (n) { return { n: n, used: false }; }),
    staffIA: STAFF.map(function (n) { return { n: n, used: false }; }),
    mullToi: false, mullIA: false,
    actionSel: null, selection: null, fini: false, prolong: false,
    log: []
  };
  m.deckToi = nouveauDeckAction();
  m.deckIA = nouveauDeckAction();
  m.mainToi = m.deckToi.splice(0, 3);
  m.mainIA = m.deckIA.splice(0, 3);
  afficher();
}
function tourAttaquant() { return m.tour % 2 === 0 ? "toi" : "ia"; }
function afficher(resume) {
  let h = '<div class="zone-duel">';
  h += '<div class="score"><div class="toi">' + m.scoreToi + '<span>Toi</span></div><div class="ia">' + m.scoreIA + "<span>IA</span></div></div>";
  if (!m.prolong) {
    h += '<div class="phase">' + (m.tour < 6 ? "1re" : "2e") + " mi-temps · Possession " + ((Math.floor(m.tour / 2) % 3) + 1) + " / 3</div>";
  } else {
    h += '<div class="phase">🏆 Prolongation · Possession ' + ((Math.floor(m.tour / 2) % 3) + 1) + "</div>";
  }
  h += "<div>" + (tourAttaquant() === "toi" ? "🔴 <b>Tu attaques</b> : choisis un tireur, (optionnel) une Action, puis lance." : "🔵 <b>Tu défends</b> : choisis ton défenseur, (optionnel) une Action, puis lance.") + "</div>";
  if (resume) h += '<div class="verdict">' + resume + "</div>";
  if (m.fini) {
    const gagne = m.scoreToi > m.scoreIA;
    const nul = m.scoreToi === m.scoreIA;
    h += '<div class="verdict">' + (nul ? "🤝 Match nul ! Un match de plus ?" : gagne ? "🎉 Victoire " + m.scoreToi + "-" + m.scoreIA + " ! L'Équipe de France est avec toi !" : "😅 Défaite " + m.scoreIA + "-" + m.scoreToi + "... revanche ?") + "</div>";
    h += '<button class="principal" onclick="nouveauMatch()">Nouveau match</button>';
  } else {
    h += '<div class="actions-row" style="margin-bottom:0">';
    for (let i = 0; i < m.staffToi.length; i++) {
      if (!m.staffToi[i].used) h += '<button class="action-btn" style="border-color:#6a4c93;color:#6a4c93" onclick="activerStaff(' + i + ')">👔 ' + m.staffToi[i].n + "</button>";
    }
    if (!m.mullToi) h += '<button class="action-btn" style="border-color:#6a4c93;color:#6a4c93" onclick="mulligan()">🔄 Mulligan (1×/mi-temps)</button>';
    h += "</div>";
    h += '<div class="actions-row">';
    h += '<span style="font-size:.8rem;font-weight:700;color:#6b7687;align-self:center">Action (1 max, main de ' + m.mainToi.length + ")&nbsp;:</span>";
    for (let i = 0; i < m.mainToi.length; i++) {
      h += '<button class="action-btn ' + (m.actionSel === i ? "select" : "") + '" onclick="toggleAction(' + i + ')">' + m.mainToi[i] + "</button>";
    }
    h += "</div>";
    h += '<div class="main-joueur">';
    for (let i = 0; i < m.toi.length; i++) {
      const c = m.toi[i];
      const auRepo = m.repoToi.indexOf(i) > -1;
      const auButs = c.p === "GARDIEN";
      h += '<div class="mini-carte ' + (m.selection === i ? "select" : auRepo || auButs ? "repo" : "") + '" ' + (auRepo || auButs ? "" : 'onclick="choisir(' + i + ')"') + ">" +
        (auButs ? '<span class="badge-repo">🧤 buts</span>' : auRepo ? '<span class="badge-repo">✓ joué</span>' : "") +
        c.ic + " <b>" + c.n + "</b>" +
        '<div class="mc-stats">' + c.p + "</div>" +
        '<div class="mc-stats">ATQ ' + c.a + " · DEF " + c.d + "</div>" +
        "</div>";
    }
    h += "</div>";
    h += '<button class="principal" ' + (m.selection === null ? "disabled" : "") + ' onclick="lancer()">Lancer le duel 🎲</button>';
  }
  h += '<ul class="log">' + m.log.slice(-8).reverse().map(function (l) { return '<li class="' + l.r + '">' + l.t + "</li>"; }).join("") + "</ul>";
  h += '<div class="regles"><b>Règles du match :</b> 2 mi-temps de 6 possessions (3 attaques, 3 défenses). Attaque : ATQ + dé 6. Défense : DEF du défenseur de champ + 1, plus un dé plafonné par la DEF de ton gardien. Si Attaque &gt; Défense : but ! Égalité : poteau. Chaque joueur de champ ne joue qu’une seule fois par mi-temps. <b>Main de 3</b> : 1 Action max par possession, pioche immédiate après usage, deck rechargé à la mi-temps, mulligan 1× par mi-temps. Tactiques par secteur : P1 ailiers, P2 arrières, P3 pivot et demi. Staff : 1 activation par carte et par mi-temps.</div>';
  h += "</div>";
  app.innerHTML = h;
}
function toggleAction(i) { m.actionSel = (m.actionSel === i ? null : i); afficher(); }
function choisir(i) { m.selection = (m.selection === i ? null : i); afficher(); }
function mulligan() {
  if (m.mullToi) return;
  m.mullToi = true;
  const ecartees = m.mainToi.slice();
  m.mainToi = [];
  piocher("toi");
  for (const c of ecartees) m.deckToi.push(c);
  m.log.push({ t: "🔄 Mulligan : main renouvelée (" + ecartees.length + " carte(s) remélangées sous le deck).", r: "bleu" });
  afficher();
}
function activerStaff(i) {
  const s = m.staffToi[i];
  if (s.used) return;
  s.used = true;
  const nom = s.n;
  let txt = "👔 Staff · " + nom + " : ";
  if (nom === "Vestiaire adverse") {
    txt += "tu vois la main de l'IA : " + m.mainIA.join(", ");
  } else if (nom === "Pression sur le banc") {
    if (m.mainIA.length) {
      const k = Math.floor(Math.random() * m.mainIA.length);
      const perdue = m.mainIA.splice(k, 1)[0];
      m.deckIA.push(perdue);
      piocher("ia");
      txt += "l'IA défausse " + perdue + " et pioche une carte.";
    } else txt += "main adverse vide.";
  } else if (nom === "Recherche tactique") {
    if (m.mainToi.length) {
      const k = Math.floor(Math.random() * m.mainToi.length);
      const defaussee = m.mainToi.splice(k, 1)[0];
      let trouvee = null;
      for (let j = 0; j < m.deckToi.length; j++) {
        if (TACTIQUES.indexOf(m.deckToi[j]) > -1) { trouvee = m.deckToi.splice(j, 1)[0]; break; }
      }
      m.deckToi.push(defaussee);
      if (trouvee) { m.mainToi.push(trouvee); m.deckToi = melanger(m.deckToi); txt += "tu défausses " + defaussee + " et récupères " + trouvee + "."; }
      else { m.mainToi.push(m.deckToi.shift()); txt += "pas de tactique dans le deck : tu pioches à la place."; }
    } else txt += "ta main est vide.";
  } else if (nom === "Changer de jeu") {
    if (m.mainToi.length) {
      const k = m.actionSel !== null ? m.actionSel : 0;
      const defaussee = m.mainToi.splice(k, 1)[0];
      piocher("toi");
      txt += "tu défausses " + defaussee + " et pioches une carte.";
    } else txt += "ta main est vide.";
  } else if (nom === "Briefing renforcé") {
    if (m.deckToi.length >= 3) {
      const top3 = m.deckToi.slice(0, 3);
      txt += "3 premières cartes du deck : " + top3.join(", ") + " ; la 2e est défaussée.";
      const defa = m.deckToi.splice(1, 1)[0];
      m.deckToi.push(defa);
    } else txt += "deck trop petit.";
  }
  m.log.push({ t: txt, r: "bleu" });
  afficher();
}
function choisirJoueurIA(atk) {
  let best = -1, bestVal = -1;
  for (let i = 0; i < m.ia.length; i++) {
    if (m.repoIA.indexOf(i) > -1) continue;
    if (m.ia[i].p === "GARDIEN") continue;
    const v = atk ? m.ia[i].a : m.ia[i].d;
    if (v > bestVal) { bestVal = v; best = i; }
  }
  return best;
}
function iaVeutJouer(role, atkCarte, defCarte) {
  if (!m.mainIA.length) return null;
  let best = null, bestScore = 0;
  for (const n of m.mainIA) {
    let s = 0;
    if (role === "att") {
      if (n === "Attaque placée") s = 1.4;
      else if (n.indexOf("Espagnole") > -1) s = defCarte.p === "AILIER" ? 2.6 : 0.3;
      else if (n.indexOf("Yago") > -1) s = SECTEUR(defCarte.p) === 3 ? 2.6 : 0.3;
      else if (n === "Kung-fu" || n === "Roucoulette" || n === "Lob") s = 1.6;
      else if (n.indexOf("7 m") > -1) s = 0.7;
      else s = 0.3;
    } else {
      if (n === "Retour placé") s = 1.4;
      else if (n.indexOf("5-1") > -1) s = atkCarte.p === "DEMI" ? 2.6 : 0.3;
      else if (n.indexOf("4-2") > -1) s = atkCarte.p === "ARRIÈRE" ? 2.6 : 0.3;
      else if (n.indexOf("0-6") > -1) s = atkCarte.p === "AILIER" ? 2.6 : 0.3;
      else if (n === "Contre-attaque") s = 0.9;
      else s = 0.3;
    }
    if (s > bestScore) { bestScore = s; best = n; }
  }
  if (best && bestScore >= 0.7 && Math.random() < 0.85) return best;
  return null;
}
function prendreAction(cote, role, atkCarte, defCarte) {
  if (cote === "toi") {
    if (m.actionSel === null) return null;
    const n = m.mainToi[m.actionSel];
    m.mainToi.splice(m.actionSel, 1);
    m.actionSel = null;
    return n;
  }
  const n = iaVeutJouer(role, atkCarte, defCarte);
  if (n) m.mainIA.splice(m.mainIA.indexOf(n), 1);
  return n || null;
}
function resoudre() {
  const attToi = tourAttaquant() === "toi";
  const dispo = m.staffIA.filter(function (s) { return !s.used; });
  if (dispo.length && Math.random() < 0.25) {
    const s = dispo[Math.floor(Math.random() * dispo.length)];
    s.used = true;
    if (s.n === "Changer de jeu" && m.mainIA.length) { const d = m.mainIA.splice(Math.floor(Math.random() * m.mainIA.length), 1)[0]; m.deckIA.push(d); piocher("ia"); }
    m.log.push({ t: "👔 Staff IA · " + s.n + ".", r: "rouge" });
  }
  const idxAtk = attToi ? m.selection : choisirJoueurIA(true);
  const idxDef = attToi ? choisirJoueurIA(false) : m.selection;
  const atkCarte = attToi ? m.toi[idxAtk] : m.ia[idxAtk];
  const defCarte = attToi ? m.ia[idxDef] : m.toi[idxDef];
  const gardienDef = attToi ? gardienDe(m.ia) : gardienDe(m.toi);
  const capGardien = gardienDef ? gardienDef.d : 6;
  const notes = [];
  const actAtk = attToi ? prendreAction("toi", "att", atkCarte, defCarte) : prendreAction("ia", "att", atkCarte, defCarte);
  const actDef = attToi ? prendreAction("ia", "def", atkCarte, defCarte) : prendreAction("toi", "def", atkCarte, defCarte);
  let bonusAtk = 0, bonusDef = 0, rate = false;
  if (actAtk === "Attaque placée") bonusAtk += 1;
  else if (actAtk && actAtk.indexOf("Espagnole") > -1) {
    if (defCarte.p === "AILIER") { bonusAtk += 2; notes.push("🔀 Espagnole : défenseur en P1, +2 !"); } else notes.push("🔀 Espagnole : défenseur hors P1, sans effet.");
  }
  else if (actAtk && actAtk.indexOf("Yago") > -1) {
    if (SECTEUR(defCarte.p) === 3) { bonusAtk += 2; notes.push("🔀 Yago : défenseur en P3, +2 !"); } else notes.push("🔀 Yago : défenseur hors P3, sans effet.");
  }
  else if (actAtk === "Kung-fu" || actAtk === "Roucoulette" || actAtk === "Lob") {
    if (Math.random() < 0.5) { bonusAtk += 3; notes.push(actAtk + " : pile ! +3 !"); } else { rate = true; notes.push(actAtk + " : face, attaque ratée !"); }
  }
  if (actDef === "Retour placé") bonusDef += 1;
  else if (actDef && actDef.indexOf("5-1") > -1) {
    if (atkCarte.p === "DEMI") { bonusDef += 2; notes.push("🔀 5-1 : tireur en P3, +2 !"); } else notes.push("🔀 5-1 : tireur hors P3, sans effet.");
  }
  else if (actDef && actDef.indexOf("4-2") > -1) {
    if (atkCarte.p === "ARRIÈRE") { bonusDef += 2; notes.push("🔀 4-2 : tireur en P2, +2 !"); } else notes.push("🔀 4-2 : tireur hors P2, sans effet.");
  }
  else if (actDef && actDef.indexOf("0-6") > -1) {
    if (atkCarte.p === "AILIER") { bonusDef += 2; notes.push("🔀 0-6 : tireur en P1, +2 !"); } else notes.push("🔀 0-6 : tireur hors P1, sans effet.");
  }
  if (attToi) { m.repoToi.push(idxAtk); m.repoIA.push(idxDef); }
  else { m.repoToi.push(idxDef); m.repoIA.push(idxAtk); }
  let but = false, butDefenseur = false, resTxt = "";
  if (rate) {
    resTxt = "❌ " + atkCarte.n + " : " + actAtk + " ratée, possession perdue !";
  } else {
    let deAtq = d6();
    let deDef = Math.min(d6(), capGardien);
    let totalAtq = atkCarte.a + deAtq + bonusAtk;
    let totalDef = defCarte.d + 1 + deDef + bonusDef;
    but = totalAtq > totalDef;
    if (!but && actAtk) {
      if (actAtk.indexOf("7 m") > -1) {
        const d7 = d6();
        if (d7 > capGardien) { but = true; notes.push("🎯 7 m : dé " + d7 + " > DEF gardien " + capGardien + ", but !"); }
        else notes.push("🎯 7 m : dé " + d7 + ", raté.");
      } else if (actAtk.indexOf("Coup franc") > -1) {
        deAtq = d6(); deDef = Math.min(d6(), capGardien);
        totalAtq = atkCarte.a + deAtq + bonusAtk; totalDef = defCarte.d + 1 + deDef + bonusDef;
        but = totalAtq > totalDef;
        notes.push("🔙 Coup franc : tous les dés relancés !");
      } else if (actAtk.indexOf("Carton jaune") > -1) {
        deAtq = d6();
        totalAtq = atkCarte.a + deAtq + bonusAtk;
        but = totalAtq > totalDef;
        notes.push("🟨 Carton jaune : dé d'attaque relancé !");
      } else if (actAtk.indexOf("2 minutes") > -1) {
        if ((attToi ? m.repoToi : m.repoIA).length >= 6) {
          deAtq = d6(); deDef = Math.min(d6(), capGardien);
          totalAtq = atkCarte.a + deAtq + bonusAtk; totalDef = defCarte.d + 1 + deDef + bonusDef;
          but = totalAtq > totalDef;
          notes.push("⏱️ 2 minutes : séquence rejouée !");
        } else notes.push("⏱️ 2 minutes : condition non remplie (il reste des joueurs).");
      }
    }
    if (but && actDef) {
      if (actDef.indexOf("Temps mort") > -1) {
        deDef = Math.min(d6(), capGardien);
        totalDef = defCarte.d + 1 + deDef + bonusDef;
        if (totalAtq <= totalDef) { but = false; notes.push("ℹ️ Temps mort : dé de défense relancé, but annulé !"); } else notes.push("ℹ️ Temps mort : insuffisant.");
      } else if (actDef.indexOf("Remise en jeu") > -1) {
        deAtq = d6(); deDef = Math.min(d6(), capGardien);
        totalAtq = atkCarte.a + deAtq + bonusAtk; totalDef = defCarte.d + 1 + deDef + bonusDef;
        but = totalAtq > totalDef;
        notes.push("🔙 Remise en jeu : tous les dés relancés !");
      } else if (actDef.indexOf("Réflexe du gardien") > -1) {
        const dG = Math.min(d6(), capGardien);
        if (defCarte.d + 1 + dG >= totalAtq) { but = false; notes.push("🧤 Réflexe du gardien : but annulé !"); } else notes.push("🧤 Réflexe du gardien : insuffisant.");
      } else if (actDef.indexOf("2 minutes") > -1) {
        if ((attToi ? m.repoIA : m.repoToi).length >= 6) {
          deAtq = d6(); deDef = Math.min(d6(), capGardien);
          totalAtq = atkCarte.a + deAtq + bonusAtk; totalDef = defCarte.d + 1 + deDef + bonusDef;
          but = totalAtq > totalDef;
          notes.push("⏱️ 2 minutes défense : séquence rejouée !");
        } else notes.push("⏱️ 2 minutes défense : condition non remplie.");
      }
    }
    if (!but && actDef === "Contre-attaque") {
      if (Math.random() < 0.5) { butDefenseur = true; notes.push("💨 Contre-attaque : face, but de contre !"); } else notes.push("💨 Contre-attaque : pile, rien.");
    }
    if (butDefenseur) resTxt = "💨 CONTRE-BUT ! " + defCarte.n + " part en contre et marque !";
    else if (but) resTxt = "⚽ BUT ! " + atkCarte.n + " (ATQ " + atkCarte.a + "+🎲" + deAtq + (bonusAtk ? "+" + bonusAtk : "") + "=" + totalAtq + ") dépasse " + defCarte.n + " (DEF " + defCarte.d + "+1+🧤≤" + capGardien + "+🎲" + deDef + (bonusDef ? "+" + bonusDef : "") + "=" + totalDef + ")";
    else if (totalAtq === totalDef) resTxt = "🏓 POTEAU ! " + totalAtq + " partout, personne ne marque.";
    else resTxt = "🧱 ARRÊT ! " + defCarte.n + " (DEF " + defCarte.d + "+1+🎲" + deDef + (bonusDef ? "+" + bonusDef : "") + "=" + totalDef + ") stoppe " + atkCarte.n + " (ATQ " + atkCarte.a + "+🎲" + deAtq + (bonusAtk ? "+" + bonusAtk : "") + "=" + totalAtq + ")";
  }
  if (actAtk) resTxt = "[" + actAtk + "] " + resTxt;
  if (actDef) resTxt = "[" + actDef + "] " + resTxt;
  if (butDefenseur) { if (attToi) m.scoreIA++; else m.scoreToi++; }
  else if (but) { if (attToi) m.scoreToi++; else m.scoreIA++; }
  m.log.push({ t: resTxt, r: attToi ? "bleu" : "rouge" });
  for (const n of notes) m.log.push({ t: n, r: "bleu" });
  piocher("toi"); piocher("ia");
  m.tour++;
  m.selection = null; m.actionSel = null;
  if (m.tour === 6) {
    m.repoToi = []; m.repoIA = [];
    recharger("toi"); recharger("ia");
    m.log.push({ t: "⏸️ MI-TEMPS ! Joueurs libres, decks rechargés, staff et mulligan réinitialisés.", r: "bleu" });
  }
  if (m.tour >= m.totalTours) {
    if (m.scoreToi === m.scoreIA) {
      m.prolong = true;
      m.totalTours += 2;
      m.repoToi = []; m.repoIA = [];
      recharger("toi"); recharger("ia");
      m.log.push({ t: "🏆 PROLONGATION ! Effectifs, decks, staff réinitialisés.", r: "bleu" });
    } else m.fini = true;
  }
  afficher(resTxt);
}
function lancer() {
  if (m.selection === null || m.fini) return;
  resoudre();
}
btnC.onclick = voirCollection;
btnD.onclick = function () { btnD.classList.add("actif"); btnC.classList.remove("actif"); nouveauMatch(); };
voirCollection();
</script>
